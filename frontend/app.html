
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapacityConnect | Unified Workspace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #f4f7fc;
      color: #18243b;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 255px;
      flex-shrink: 0;
      background: #101b35;
      color: white;
      padding: 25px 16px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      padding: 0 12px;
      letter-spacing: -0.6px;
    }

    .brand span {
      color: #62d9cf;
    }

    .subtitle {
      color: #a5b3cc;
      font-size: 12px;
      padding: 8px 12px 30px;
    }

    .section-label {
      color: #8494b1;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 0 12px 12px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav button {
      border: 0;
      background: transparent;
      color: #c3cee1;
      text-align: left;
      padding: 13px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav button:hover {
      background: #202e4d;
      color: white;
    }

    .nav button.active {
      background: #294b82;
      color: white;
      box-shadow: inset 3px 0 #62d9cf;
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 17px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 15px 12px;
      border-top: 1px solid #293652;
      color: #a5b3cc;
      font-size: 12px;
      line-height: 1.8;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 76px;
      flex-shrink: 0;
      background: white;
      border-bottom: 1px solid #e7ebf3;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 750;
    }

    .page-description {
      font-size: 12px;
      color: #71809a;
      margin-top: 5px;
    }

    .status {
      background: #e8f8f3;
      color: #15785d;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      padding: 14px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
      background: white;
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: #edf2fb;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        z-index: 10;
        top: 0;
        bottom: 0;
        left: -260px;
        transition: left 0.25s;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        padding: 0 14px;
      }

      .page-title {
        font-size: 16px;
      }

      .status {
        display: none;
      }

      .workspace {
        padding: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">Capacity<span>Connect</span></div>
      <div class="subtitle">Workforce Learning Platform</div>

      <div class="section-label">WORKSPACE</div>

      <nav class="nav">
        <button class="active" data-page="index.html"
          data-title="Dashboard"
          data-description="Organizational learning overview">
          <span class="nav-icon">▦</span> Dashboard
        </button>

        <button data-page="skill-gap.html"
          data-title="Skill Gap Analysis"
          data-description="Identify skill gaps and development priorities">
          <span class="nav-icon">◈</span> Skill Gaps
        </button>

        <button data-page="trainers.html"
          data-title="Trainer Matcher"
          data-description="Explore trainers matched to employee skills">
          <span class="nav-icon">♙</span> Trainers
        </button>

        <button data-page="learning.html"
          data-title="Learning Management"
          data-description="Browse courses and track learning progress">
          <span class="nav-icon">▤</span> Learning
        </button>

        <button data-page="assessments.html"
          data-title="Assessments"
          data-description="Record assessment scores and review progress">
          <span class="nav-icon">✓</span> Assessments
        </button>

        <button data-page="simulator.html"
          data-title="Capacity Simulator"
          data-description="Explore hypothetical training scenarios">
          <span class="nav-icon">◉</span> Simulator
        </button>

        <button data-page="assistant.html"
          data-title="AI Assistant"
          data-description="Get help navigating capacity-building information">
          <span class="nav-icon">✧</span> Assistant
        </button>
      </nav>

      <div class="sidebar-footer">
        <strong>CapacityConnect</strong><br>
        Digital Capacity Building<br>
        Unified Workspace
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="mobile-menu" id="menuButton"
            aria-label="Toggle navigation">☰</button>
          <div>
            <div class="page-title" id="pageTitle">Dashboard</div>
            <div class="page-description" id="pageDescription">
              Organizational learning overview
            </div>
          </div>
        </div>

        <div class="status">● Workspace</div>
      </header>

      <section class="workspace">
        <iframe id="contentFrame" title="CapacityConnect content"
          src="index.html"></iframe>
      </section>
    </main>
  </div>

  <script>
    const frame = document.getElementById("contentFrame");
    const title = document.getElementById("pageTitle");
    const description = document.getElementById("pageDescription");
    const sidebar = document.getElementById("sidebar");
    const buttons = document.querySelectorAll(".nav button");

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        const page = button.dataset.page;

        buttons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");

        title.textContent = button.dataset.title;
        description.textContent = button.dataset.description;

        if (frame.getAttribute("src") !== page) {
          frame.src = page;
        }

        sidebar.classList.remove("open");
      });
    });

    document.getElementById("menuButton").addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });
  </script>
</body>
</html>
